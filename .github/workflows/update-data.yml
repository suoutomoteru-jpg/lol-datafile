name: Update LoL reference data

# DDragon(ja_JP)のチャンピオン基礎ステ・アイテムデータと、lol-database (nunune.gg)
# が生成済みのスキルツールチップ(静的JSON読み取りのみ、nunune.gg本体には無関係)から
# AIリファレンス用のMarkdownを再生成する。
#
# 実行頻度は毎月1日・15日の3:00 JST（=18:00 UTC）、おおよそ2週間に1回。
# LoLのパッチ間隔(約2週間)に合わせている。

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 18 1,15 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate reference data
        run: python3 scripts/build_all.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ VERSION
          if git diff --cached --quiet; then
            echo "変更なし（既に最新）"
          else
            git commit -m "chore: regenerate reference data from DDragon/lol-database"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
